[package]
name = "ferrum-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ferrum-core = { path = "../core" }
ferrum-chemistry = { path = "../chemistry" }
ferrum-geometry = { path = "../geometry" }
ferrum-domain = { path = "../domain" }
ferrum-document = { path = "../document" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["float_roundtrip"] }
thiserror = { version = "*" }
ttf-parser = { version = "*" }
sha2 = { version = "*" }
xot = { version = "*" }
tiny-skia = { version = "*", default-features = false, features = ["std"] }
png = { version = "*" }
pdf-writer = { version = "*" }

[dev-dependencies]
rustix = { version = "*", features = ["fs"] }
