[package]
name = "ferrum-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "*", features = ["derive"] }
ferrum-document = { path = "../document" }
ferrum-domain = { path = "../domain" }
ferrum-chemistry = { path = "../chemistry" }
ferrum-core = { path = "../core" }
ferrum-geometry = { path = "../geometry" }
ferrum-render = { path = "../render" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
schemars = { version = "*" }
base64 = { version = "*" }
rustix = { version = "*", features = ["fs"] }
getrandom = { version = "*" }
thiserror = { version = "*" }
xot = { version = "*" }
