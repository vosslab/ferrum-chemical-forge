[package]
name = "ferrum-api-python-native"
version = "26.8.0"
edition = "2024"
rust-version = "1.97.1"
license = "LGPL-3.0-only"
publish = false

# This maturin project builds outside the Rust workspace so it can produce a
# self-contained Python extension wheel.
[workspace]

[lib]
name = "ferrum_chem"
crate-type = ["cdylib"]

[dependencies]
ferrum-document = { path = "../../document" }
pyo3 = { version = "*", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = { version = "*", features = ["extension-module"] }
