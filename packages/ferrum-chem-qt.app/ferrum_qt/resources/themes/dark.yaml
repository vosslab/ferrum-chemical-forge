# Dark theme for Ferrum
#
# Each theme file defines colors for four layers:
#   gui:       toolbar, buttons, tabs, status bar, edit pool
#   chemistry: default colors for bonds and atom labels
#   paper:     paper rectangle fill and outline
#   grid:      hex grid overlay lines and dots
#
# The filename (without .yaml) is the theme key used internally.
# The 'name' field is the human-readable label shown in the UI.

name: "Dark"
ribbon:
  shell: "#1d2733"
  header_bg: "#0b1f33"
  header_fg: "#f7fbff"
  header_muted: "#a9bdd1"
  tab_hover: "#173a5c"
  tab_active_bg: "#24384d"
  tab_active_fg: "#ffffff"
  surface: "#1d2733"
  group_bg: "#273544"
  group_border: "#3d4f61"
  button_bg: "#223140"
  button_fg: "#f1f5f9"
  button_border: "#6a8097"
  button_hover: "#334b63"
  button_checked: "#1e507b"
  button_checked_border: "#72b7ff"
  button_disabled_bg: "#29333d"
  button_disabled_fg: "#9aa8b5"
  caption_fg: "#bac9d8"
  context_bg: "#173a5c"
  context_fg: "#eef7ff"
  focus: "#ffc247"
  accent_utility: "#ffc247"
  accent_selection: "#72b7ff"
  accent_drawing: "#35d0b4"
  accent_structure: "#96d65c"
  accent_reaction: "#ff8d73"
  accent_annotation: "#c095ff"
  accent_view: "#65c4d4"
