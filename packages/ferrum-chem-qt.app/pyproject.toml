[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrum-qt"
version = "26.08"
description = "Ferrum-Qt - 2D molecular structure editor"
readme = {text = "Ferrum-Qt is a PySide6 2D molecular structure editor.", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Neil Voss"}]
dependencies = [
    "PySide6>=6.7",
    "shiboken6>=6.7",
    "pyyaml",
    # Temporary migration dependency; remove at M22 with its Python RDKit dependency.
    "oasa>=26.08",
]

[project.urls]
Homepage = "https://github.com/vosslab/ferrum-chemical-forge"
Issues = "https://github.com/vosslab/ferrum-chemical-forge/issues"

[project.scripts]
ferrum-qt = "ferrum_qt.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ferrum_qt*"]

[tool.setuptools.package-data]
ferrum_qt = [
    "resources/*.yaml",
    "resources/themes/*.yaml",
    "resources/pixmaps/png/*.png",
    "resources/pixmaps/png-dark/*.png",
    "resources/app_icon.svg",
]
