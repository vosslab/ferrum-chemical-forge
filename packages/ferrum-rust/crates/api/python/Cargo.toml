[package]
name = "ferrum-api-python-native"
version = "26.8.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only"
publish = false

# This maturin project intentionally builds outside the Rust workspace: its
# dynamic library location is supplied by the packaging tool, not Cargo users.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25.1", features = ["extension-module"] }
