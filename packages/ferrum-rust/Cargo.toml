[workspace]
members = [
    "crates/api",
    "crates/api-python",
    "crates/chemistry",
    "crates/core",
    "crates/document",
    "crates/document-projection",
    "crates/document-render",
    "crates/catalog-placement",
    "crates/template-catalog",
    "crates/document-model",
    "crates/domain",
    "crates/geometry",
    "crates/graph-lowering",
    "crates/render",
    "crates/render-contract",
]
resolver = "3"

[workspace.package]
version = "26.9.0"
edition = "2024"
rust-version = "1.97.1"
license = "LGPL-3.0-only"
repository = "https://github.com/vosslab/ferrum-chemical-forge"
homepage = "https://github.com/vosslab/ferrum-chemical-forge"
documentation = "https://github.com/vosslab/ferrum-chemical-forge"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Retain compiled dependencies for practical edit/build cycles without allowing
# incremental object caches and full dependency debuginfo to consume tens of GB.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
