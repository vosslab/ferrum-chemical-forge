# Light theme for Ferrum (default)
#
# Each theme file defines colors for four layers:
#   gui:       toolbar, buttons, tabs, status bar, edit pool
#   chemistry: default colors for bonds and atom labels
#   paper:     paper rectangle fill and outline
#   grid:      hex grid overlay lines and dots
#
# The filename (without .yaml) is the theme key used internally.
# The 'name' field is the human-readable label shown in the UI.

name: "Light"
ribbon:
  shell: "#edf3fa"
  header_bg: "#16324f"
  header_fg: "#ffffff"
  header_muted: "#c9d7e5"
  tab_hover: "#244d73"
  tab_active_bg: "#ffffff"
  tab_active_fg: "#163f73"
  surface: "#edf3fa"
  group_bg: "#ffffff"
  group_border: "#ced9e6"
  button_bg: "#f7faff"
  button_fg: "#1f2937"
  button_border: "#7b8fa4"
  button_hover: "#e3efff"
  button_checked: "#d7ebff"
  button_checked_border: "#2d7dd2"
  button_disabled_bg: "#eef1f5"
  button_disabled_fg: "#5f6979"
  caption_fg: "#40536b"
  context_bg: "#dcecff"
  context_fg: "#133a63"
  focus: "#ef3f5f"
  accent_utility: "#bd8100"
  accent_selection: "#2d7dd2"
  accent_drawing: "#009b86"
  accent_structure: "#5a902a"
  accent_reaction: "#e76143"
  accent_annotation: "#8a58cf"
  accent_view: "#318a9a"
document_display:
  canvas_surround: "#596675"
  page_fill: "#ffffff"
  page_outline: "#71717a"
  document_foreground: "#1f2328"
  atom_number: "#0056b3"
  selection_outline: "#0066cc"
  hover_outline: "#0077b6"
  preview_outline: "#5e3bb0"
  preview_fill: "#4a8ac7"
