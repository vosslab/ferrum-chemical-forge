[package]
name = "ferrum-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ferrum-core = { path = "../core" }
ferrum-chemistry = { path = "../chemistry" }
ferrum-domain = { path = "../domain" }
ferrum-geometry = { path = "../geometry" }
ferrum-document-projection = { path = "../document-projection" }
ferrum-graph-lowering = { path = "../graph-lowering" }
ferrum-document-model = { path = "../document-model" }
ferrum-render = { path = "../render" }
ferrum-render-contract = { path = "../render-contract" }
getrandom = { version = "*" }
rustix = { version = "*", features = ["fs"] }
serde = { version = "*", features = ["derive"] }
schemars = { version = "*" }
sha2 = { version = "*" }
thiserror = { version = "*" }
xot = { version = "*" }
xmlparser = { version = "*" }

[dev-dependencies]
ferrum-render = { path = "../render", features = ["glyph_bond_raster_test_support"] }
proptest = { version = "*" }
serde_json = { version = "*" }
