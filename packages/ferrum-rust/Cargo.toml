[workspace]
members = [
    "crates/api",
    "crates/chemistry",
    "crates/core",
    "crates/document",
    "crates/domain",
    "crates/geometry",
    "crates/render",
]
resolver = "3"

[workspace.package]
version = "26.8.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-only"
repository = "https://github.com/vosslab/ferrum-chemical-forge"
homepage = "https://github.com/vosslab/ferrum-chemical-forge"
documentation = "https://github.com/vosslab/ferrum-chemical-forge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
