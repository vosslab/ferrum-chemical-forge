[package]
name = "ferrum-api-python-native"
version = "26.8.0"
edition = "2024"
rust-version = "1.97.1"
license = "LGPL-3.0-only"
publish = false

# This maturin project builds outside the Rust workspace so it can produce a
# self-contained Python extension wheel.
[workspace]

[lib]
name = "ferrum_chem"
crate-type = ["cdylib"]

[dependencies]
ferrum-api = { path = ".." }
ferrum-chemistry = { path = "../../chemistry" }
ferrum-core = { path = "../../core" }
ferrum-document = { path = "../../document" }
ferrum-domain = { path = "../../domain" }
ferrum-geometry = { path = "../../geometry" }
pyo3 = { version = "*", features = ["extension-module", "multiple-pymethods"] }
serde_json = { version = "*" }

[build-dependencies]
pyo3-build-config = { version = "*", features = ["extension-module"] }

# This standalone workspace shares the repository target directory. Keep useful
# line tables for Ferrum code while avoiding unbounded incremental object caches.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
