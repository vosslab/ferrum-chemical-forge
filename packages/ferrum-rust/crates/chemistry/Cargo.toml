[package]
name = "ferrum-chemistry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[lints.rust]
# The private native-engine adapter boundary owns the only FFI operations in
# this crate. Public chemistry types remain safe Rust values.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
libloading = { version = "*" }
thiserror = { version = "*" }
serde = { version = "*", features = ["derive"] }
schemars = { version = "*" }
xmlparser = { version = "*" }
