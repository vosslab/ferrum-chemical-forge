[package]
name = "ferrum-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
clap = { version = "*", features = ["derive"] }
ferrum-document = { path = "../document" }
ferrum-document-render = { path = "../document-render" }
ferrum-catalog-placement = { path = "../catalog-placement" }
ferrum-domain = { path = "../domain" }
ferrum-chemistry = { path = "../chemistry" }
ferrum-core = { path = "../core" }
ferrum-render = { path = "../render" }
ferrum-geometry = { path = "../geometry" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
schemars = { version = "*" }
base64 = { version = "*" }
sha2 = { version = "*" }
libc = { version = "*" }
rustix = { version = "*", features = ["fs"] }
thiserror = { version = "*" }
pyo3 = { version = "*", features = ["multiple-pymethods"], optional = true }
getrandom = { version = "*", optional = true }

[features]
# PyO3 transport is compiled inside this crate so Rust visibility, rather than
# a cross-crate convention, seals the installed-wheel runtime capability.
python-binding = ["dep:pyo3", "dep:getrandom"]
python-extension-module = ["python-binding", "pyo3/extension-module"]
# Nonshipping only: lets the sealed PyO3 transport harness lower the already
# admitted SMARTS response ceiling. Production wheel routes never enable this.
response-size-e2e-harness = []

[build-dependencies]
pyo3-build-config = { version = "*" }
